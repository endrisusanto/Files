plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.example.bridge"
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.example.bridge"
        minSdk 26
        targetSdk 35
        versionCode 236
        versionName "0.1.136"
    }

    flavorDimensions "mode"
    productFlavors {
        bridge {
            dimension "mode"
            applicationId "com.example.bridge"
            manifestPlaceholders = [appLabel: "FireFiles Bridge"]
        }
        monitor {
            dimension "mode"
            applicationId "com.example.bridge.monitor"
            manifestPlaceholders = [appLabel: "FireFiles Monitor"]
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation "com.hierynomus:smbj:0.13.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
}
