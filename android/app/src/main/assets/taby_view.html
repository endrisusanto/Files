<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Taby Desk Assistant</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .desk-stage {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      touch-action: none;
      perspective: 800px;
      overflow: hidden;
    }

    .gif-container {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transform-style: preserve-3d;
      will-change: transform;
      transition: transform 0.08s ease-out;
    }

    .taby-gif {
      position: absolute;
      width: auto;
      height: 100%;
      max-width: 100%;
      object-fit: contain;
      background-color: #000000;
      opacity: 0;
      transition: opacity 0.22s ease-in-out;
      pointer-events: none;
      will-change: opacity, transform;
    }

    .taby-gif.active {
      opacity: 1;
    }

    /* Rotation and scaling presets */
    .rot-0 { transform: rotate(0deg); }
    .rot-90 { transform: rotate(90deg) scale(1.35); }
    .rot-180 { transform: rotate(180deg); }
    .rot-270 { transform: rotate(270deg) scale(1.35); }

    /* Interactive squish bounce when tapped */
    @keyframes squishBounce {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.08, 0.92); }
      60%  { transform: scale(0.95, 1.05); }
      85%  { transform: scale(1.02, 0.98); }
      100% { transform: scale(1); }
    }

    .gif-container.squish {
      animation: squishBounce 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Minimal Distraction-Free UI Layer with Auto Fade */
    .ui-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 20;
    }

    .ui-layer.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* Top Left Status Dot */
    .top-dot-badge {
      position: absolute;
      top: 16px;
      left: 18px;
      width: 28px;
      height: 28px;
      background: rgba(22, 27, 34, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3fb950;
      box-shadow: 0 0 8px #3fb950;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Top Right Exit Button */
    .exit-btn-minimal {
      position: absolute;
      top: 16px;
      right: 18px;
      width: 28px;
      height: 28px;
      background: rgba(22, 27, 34, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #8b949e;
      font-size: 13px;
      font-weight: 700;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .exit-btn-minimal:active {
      background: rgba(248, 81, 73, 0.3);
      color: #f85149;
      border-color: #f85149;
    }

    /* Top Center HUD Badge */
    .hud-overlay {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      pointer-events: none;
      max-width: 60%;
    }
    .hud-main {
      font-size: 11px;
      font-weight: 700;
      color: #f0f6fc;
      font-family: ui-monospace, SFMono-Regular, monospace;
      background: rgba(22, 27, 34, 0.85);
      border: 1px solid rgba(56, 139, 253, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 4px 12px;
      border-radius: 12px;
      text-align: center;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <div class="desk-stage" id="stage">
    <!-- Double-buffered container for flicker-free GIF transitions and 2.5D head/gaze tilt -->
    <div class="gif-container" id="gifContainer">
      <img id="tabyImgA" class="taby-gif rot-270 active" src="taby/5e63dbe6.gif" alt="Taby Face A" />
      <img id="tabyImgB" class="taby-gif rot-270" src="taby/5e63dbe6.gif" alt="Taby Face B" />
    </div>

    <!-- Minimal Overlay Layer (auto fades) -->
    <div class="ui-layer" id="uiLayer">
      <!-- Top Left Pulse Dot -->
      <div class="top-dot-badge" id="topBadge" title="Hub Online">
        <span class="pulse-dot"></span>
      </div>

      <!-- Top Center Clean Badge -->
      <div class="hud-overlay" id="hudOverlay">
        <div class="hud-main" id="hudMain">
          <span id="hudText">STANDBY</span>
        </div>
      </div>

      <!-- Top Right Exit X -->
      <div class="exit-btn-minimal" id="exitBtn" onclick="onExit(event)" title="Exit to Dashboard">
        ✕
      </div>
    </div>
  </div>

  <script>
    const stage = document.getElementById("stage");
    const gifContainer = document.getElementById("gifContainer");
    const imgA = document.getElementById("tabyImgA");
    const imgB = document.getElementById("tabyImgB");
    const uiLayer = document.getElementById("uiLayer");
    const hudOverlay = document.getElementById("hudOverlay");
    const hudMain = document.getElementById("hudMain");
    const hudText = document.getElementById("hudText");

    let activeBuffer = "A"; // Tracks which buffer is currently visible
    let currentRot = Number(localStorage.getItem("taby_rotation")) || 270;
    let gazeTrackingEnabled = true;

    const ANIM_MAP = {
      "angry_01_loop": "342748ab.gif",

      "basketball_dunk": "4aaf4aeb.gif",

      "calendar_loop": "142c3c3e.gif",
      "circle": "28217089.gif",
      "confirmation": "72811854.gif",
      "copy_paste": "9ba1094c.gif",
      "creating_task_loop": "820fb8d5.gif",
      "delete_01": "8bd97a14.gif",
      "disappointed": "fdf9d899.gif",

      "f1_car": "01516801.gif",
      "fishing_long": "76916c58.gif",
      "fishing_short": "d83e6b18.gif",
      "flower_grow": "c24cfa30.gif",
      "hello_annoyed": "112e0d2a.gif",
      "idle": "5e63dbe6.gif",
      "idle_01_loop": "5e63dbe6.gif",
      "calm_idle_01_f000": "684df770.gif",
      "calm_idle_01_to_f137": "6e98b1e7.gif",
      "calm_idle_01_f137": "5bddc705.gif",
      "calm_idle_01_f137_to_f177": "78606a43.gif",
      "calm_idle_01_f177": "ebe7a411.gif",
      "calm_idle_01_f177_to_f216": "a68aca9f.gif",
      "calm_idle_01_f216": "c97f9fc9.gif",
      "calm_work_low_f000": "5b0de03a.gif",
      "calm_work_medium_f000": "d18417a7.gif",
      "calm_work_high_f000": "ddde01ce.gif",
      "idle_02_loop": "523e19a5.gif",
      "idle_variation_loop": "6d1a57d8.gif",
      "listening_in": "344f0094.gif",
      "listening_loop": "56203d05.gif",

      "lockin": "f821100d.gif",
      "love_01": "7f1c7a6d.gif",
      "perfect_day_01": "ad8326e3.gif",
      "perfect_day_01_simple": "1fdab856.gif",
      "perfect_day_02": "ae832876.gif",
      "perfect_day_03": "af832a09.gif",
      "posture_check": "cab8bb54.gif",
      "relaxing_01_loop": "055ed02e.gif",
      "relaxing_couch_in": "93338d4c.gif",
      "relaxing_couch_loop": "f30dc7ed.gif",
      "sleeping_loop": "c2433a43.gif",
      "square": "b4b61246.gif",
      "startup": "94326baa.gif",
      "stretching": "51374816.gif",
      "talking_default_loop": "9725f4ae.gif",
      "task_completed": "2a3d7c56.gif",
      "task_created": "545a9747.gif",
      "task_page": "3cb8ff8a.gif",
      "thumbs_up": "2620c9f8.gif",
      "trophy": "3bbde2ff.gif",
      "turn_off_reddit": "aa90b429.gif",
      "turn_off_scroll": "0de3a548.gif",
      "turn_off_tv": "64680343.gif",
      "waiting_01": "afd018ca.gif",
      "working_in": "967e5b2e.gif",
      "working_loop": "ff09215b.gif",
      "working_laptop_in": "abbf00c9.gif",
      "working_laptop_loop": "cdd1dbdc.gif",
      "working_laptop_bored_loop": "89a7efbb.gif",
      "working_laptop_excited_loop": "8d8c83cf.gif",
      "working_laptop_normal_loop": "ae5cd9c4.gif",
      "workspaces_in": "2b60f7ff.gif",
      "workspaces_loop": "b844443e.gif",
      "wow": "22e8e504.gif",
      "codex_in": "323ff7c2.gif",
      "codex_loop": "be0baa0f.gif",
      "day_planned": "ac6f32d0.gif",
      "hello_disappointed": "867ad27c.gif",
      "claude_in": "547c0037.gif",
      "claude_loop": "12c5e086.gif",
      "taby_response_ready_in": "9d165367.gif",
      "taby_response_ready_loop": "d3087456.gif",
      "yeah": "a87f43aa.gif",
      "no": "62366ffa.gif",
      "review": "225772e1.gif",
      "searching_loop": "4bbe8926.gif"
    };

    const WORK_KEYS = new Set([
      "busy_loop", "calm_work_low_f000", "calm_work_medium_f000", "calm_work_high_f000",
      "working_in", "working_loop", "working_laptop_in", "working_laptop_loop",
      "working_laptop_bored_loop", "working_laptop_excited_loop", "working_laptop_normal_loop",
      "workspaces_in", "workspaces_loop", "codex_in", "codex_loop", "claude_in", "claude_loop",
      "searching_loop", "copy_paste", "creating_task_loop"
    ]);

    const SUCCESS_KEYS = new Set([
      "task_completed", "trophy", "perfect_day_01", "perfect_day_01_simple",
      "perfect_day_02", "perfect_day_03", "yeah", "thumbs_up", "confirmation",
      "day_planned", "wow"
    ]);

    // ponytail: exclude unwanted animations from idle loop as requested
    const EXCLUDED_IDLE_KEYS = new Set([
      "review",
      "taby_response_ready_loop",
      "taby_response_ready_in",
      "day_planned",
      "working_laptop_normal_loop",
      "workspaces_in",
      "workspaces_loop",
      "task_page",
      "lockin",
      "listening_loop",
      "listening_in",
      "listening_music_loop",
      "disappointed",
      "hello_disappointed",
      "delete_01",
      "blush",
      "circle"
    ]);

    const IDLE_PLAYLIST = Object.keys(ANIM_MAP).filter(key => 
      !WORK_KEYS.has(key) && 
      !SUCCESS_KEYS.has(key) && 
      !EXCLUDED_IDLE_KEYS.has(key) && 
      !key.startsWith("angry")
    );

    let idleTimer = null;
    let idleIndex = 0;
    let resetTimer = null;
    let fadeTimer = null;
    let isTransferring = false;
    let isTemporaryTriggerActive = false;

    // --- Double-Buffered Flicker-Free GIF Switcher ---
    function switchGif(fileName) {
      const targetSrc = "taby/" + fileName;
      const currentImg = activeBuffer === "A" ? imgA : imgB;
      const nextImg = activeBuffer === "A" ? imgB : imgA;

      if (currentImg.getAttribute("src") === targetSrc && currentImg.classList.contains("active")) {
        return; // Already playing
      }

      nextImg.onload = () => {
        nextImg.classList.add("active");
        currentImg.classList.remove("active");
        activeBuffer = activeBuffer === "A" ? "B" : "A";
      };
      nextImg.src = targetSrc;
    }

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    let shuffledIdleList = shuffle(IDLE_PLAYLIST);

    function playNextIdle() {
      if (isTransferring || isTemporaryTriggerActive) return;
      if (idleIndex >= shuffledIdleList.length) {
        shuffledIdleList = shuffle(IDLE_PLAYLIST);
        idleIndex = 0;
      }
      const animKey = shuffledIdleList[idleIndex++] || "idle_01_loop";
      const file = ANIM_MAP[animKey] || "5e63dbe6.gif";
      switchGif(file);
      hudText.textContent = "STANDBY";
      
      const nextDuration = 5000 + Math.floor(Math.random() * 3000);
      if (idleTimer) clearTimeout(idleTimer);
      idleTimer = setTimeout(playNextIdle, nextDuration);
    }

    function startIdleLoop() {
      if (isTransferring || isTemporaryTriggerActive) return;
      if (idleTimer) clearTimeout(idleTimer);
      playNextIdle();
    }

    function stopIdleLoop() {
      if (idleTimer) {
        clearTimeout(idleTimer);
        idleTimer = null;
      }
    }

    function showUiBriefly(durationMs = 3500) {
      uiLayer.classList.add("visible");
      if (fadeTimer) clearTimeout(fadeTimer);
      if (!isTransferring) {
        fadeTimer = setTimeout(() => {
          uiLayer.classList.remove("visible");
        }, durationMs);
      }
    }

    // --- Interactive 2.5D Gaze & Head Tilt Engine ---
    let targetLookX = 0;
    let targetLookY = 0;
    let currentLookX = 0;
    let currentLookY = 0;
    let isTrackingCursor = false;
    let cursorIdleTimer = null;
    let gazeAnimId = null;

    function updateGaze() {
      if (!gazeTrackingEnabled) {
        gifContainer.style.transform = "";
        gazeAnimId = null;
        return;
      }

      const dx = targetLookX - currentLookX;
      const dy = targetLookY - currentLookY;

      // Smooth lerp (spring damping factor: 0.14)
      currentLookX += dx * 0.14;
      currentLookY += dy * 0.14;

      const tiltY = currentLookX * 13; // Max 13 deg yaw
      const tiltX = -currentLookY * 13; // Max 13 deg pitch
      const shiftX = currentLookX * 16; // Max 16px translation
      const shiftY = currentLookY * 16;

      gifContainer.style.transform = `perspective(700px) rotateX(${tiltX.toFixed(2)}deg) rotateY(${tiltY.toFixed(2)}deg) translate3d(${shiftX.toFixed(1)}px, ${shiftY.toFixed(1)}px, 0)`;

      if (Math.abs(dx) > 0.001 || Math.abs(dy) > 0.001 || isTrackingCursor) {
        gazeAnimId = requestAnimationFrame(updateGaze);
      } else {
        gazeAnimId = null;
      }
    }

    function startGazeLoop() {
      if (!gazeAnimId) {
        gazeAnimId = requestAnimationFrame(updateGaze);
      }
    }

    function setCursorCoords(nx, ny) {
      if (!gazeTrackingEnabled) return;
      nx = Math.max(-1, Math.min(1, nx));
      ny = Math.max(-1, Math.min(1, ny));

      // Rotate coordinates to align with screen display rotation
      const rad = (-currentRot * Math.PI) / 180;
      const rotX = nx * Math.cos(rad) - ny * Math.sin(rad);
      const rotY = nx * Math.sin(rad) + ny * Math.cos(rad);

      targetLookX = rotX;
      targetLookY = rotY;
      isTrackingCursor = true;

      startGazeLoop();

      if (cursorIdleTimer) clearTimeout(cursorIdleTimer);
      cursorIdleTimer = setTimeout(() => {
        // Return to center when cursor/touch is idle
        targetLookX = 0;
        targetLookY = 0;
        isTrackingCursor = false;
        startGazeLoop();
      }, 2500);
    }

    // Public API for remote cursor (from PC WebSocket or Android Bridge)
    window.setRemoteCursor = function(normX, normY) {
      setCursorCoords(Number(normX) || 0, Number(normY) || 0);
    };

    // Pointer & Touch Event Listeners on Stage
    stage.addEventListener("pointermove", (e) => {
      const rect = stage.getBoundingClientRect();
      if (rect.width > 0 && rect.height > 0) {
        const nx = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        const ny = ((e.clientY - rect.top) / rect.height) * 2 - 1;
        setCursorCoords(nx, ny);
      }
    });

    stage.addEventListener("pointerdown", (e) => {
      const rect = stage.getBoundingClientRect();
      if (rect.width > 0 && rect.height > 0) {
        const nx = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        const ny = ((e.clientY - rect.top) / rect.height) * 2 - 1;
        setCursorCoords(nx, ny);
      }
      onStageTap(e);
    });

    stage.addEventListener("pointerleave", () => {
      targetLookX = 0;
      targetLookY = 0;
      isTrackingCursor = false;
      startGazeLoop();
    });

    function onStageTap(e) {
      showUiBriefly(3500);

      // Squish bounce effect
      gifContainer.classList.remove("squish");
      void gifContainer.offsetWidth; // Force reflow
      gifContainer.classList.add("squish");

      // Random friendly reaction when not transferring
      if (!isTransferring && !isTemporaryTriggerActive) {
        const reactions = ["wow", "thumbs_up", "yeah"];
        const rand = reactions[Math.floor(Math.random() * reactions.length)];
        playExpression(rand, "INTERACTION", "", 2000);
      }
    }

    function playExpression(animKey, title, subtext, durationMs) {
      if (resetTimer) {
        clearTimeout(resetTimer);
        resetTimer = null;
      }

      const file = ANIM_MAP[animKey] || (animKey.endsWith(".gif") ? animKey : (ANIM_MAP["idle"] || "5e63dbe6.gif"));
      switchGif(file);

      if (title) {
        hudText.textContent = title;
      } else {
        hudText.textContent = "STANDBY";
      }

      const isIdleKey = IDLE_PLAYLIST.includes(animKey);
      if (!isIdleKey || (title && title !== "STANDBY")) {
        showUiBriefly(durationMs && durationMs > 0 ? durationMs : 3500);
      }

      if (durationMs && durationMs > 0) {
        isTemporaryTriggerActive = true;
        stopIdleLoop();
        resetTimer = setTimeout(() => {
          isTemporaryTriggerActive = false;
          uiLayer.classList.remove("visible");
          hudText.textContent = "STANDBY";
          startIdleLoop();
        }, durationMs);
      } else if (isIdleKey) {
        isTemporaryTriggerActive = false;
        startIdleLoop();
      }
    }

    function setTransferProgress(speedText, percent, fileName) {
      if (percent >= 100) {
        isTransferring = false;
        isTemporaryTriggerActive = true;
        stopIdleLoop();
        playExpression("task_completed", "TRANSFER COMPLETE (100%)", "", 4000);
        showUiBriefly(4000);
        setTimeout(() => {
          isTemporaryTriggerActive = false;
          uiLayer.classList.remove("visible");
          hudText.textContent = "STANDBY";
          startIdleLoop();
        }, 4000);
      } else {
        isTransferring = true;
        stopIdleLoop();
        uiLayer.classList.add("visible");
        playExpression("working_loop", "UPLOADING · " + (speedText || "") + " (" + percent + "%)", "", 0);
      }
    }

    function setAdbPushProgress(speedText, percent, fileName) {
      if (percent >= 100) {
        isTransferring = false;
        isTemporaryTriggerActive = true;
        stopIdleLoop();
        playExpression("task_completed", "PUSH COMPLETE (100%)", "", 4000);
        showUiBriefly(4000);
        setTimeout(() => {
          isTemporaryTriggerActive = false;
          uiLayer.classList.remove("visible");
          hudText.textContent = "STANDBY";
          startIdleLoop();
        }, 4000);
      } else {
        isTransferring = true;
        stopIdleLoop();
        uiLayer.classList.add("visible");
        playExpression("working_laptop_excited_loop", "ADB PUSH · " + (speedText || "") + " (" + percent + "%)", "", 0);
      }
    }

    function setRotation(deg) {
      currentRot = deg;
      localStorage.setItem("taby_rotation", String(deg));
      imgA.className = "taby-gif rot-" + deg + (activeBuffer === "A" ? " active" : "");
      imgB.className = "taby-gif rot-" + deg + (activeBuffer === "B" ? " active" : "");
    }

    function updateConfig(configJson) {
      try {
        const cfg = typeof configJson === "string" ? JSON.parse(configJson) : configJson;
        if (cfg.rotation !== undefined) {
          setRotation(cfg.rotation);
        }
        if (cfg.hud_visible !== undefined) {
          hudOverlay.style.display = cfg.hud_visible ? "flex" : "none";
        }
        if (cfg.gaze_tracking !== undefined) {
          gazeTrackingEnabled = !!cfg.gaze_tracking;
          if (!gazeTrackingEnabled) {
            gifContainer.style.transform = "";
          }
        }
        if (cfg.map && typeof cfg.map === "object") {
          Object.assign(ANIM_MAP, cfg.map);
        }
      } catch(e) {
        console.error("Failed to parse config:", e);
      }
    }

    function onExit(e) {
      if (e) e.stopPropagation();
      if (window.AndroidBridge && window.AndroidBridge.closeFaceMode) {
        window.AndroidBridge.closeFaceMode();
      }
    }

    // Initialize with default rotation and start idle cycle
    setRotation(currentRot);
    startIdleLoop();
  </script>
</body>
</html>
