<html lang="en">

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #08080b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 14px;
    }

    .container {
      width: 100%;
      max-width: 1120px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .header {
      text-align: center;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    .header p {
      font-size: 12px;
      color: #a1a1aa;
    }

    /* Screen Stage */
    .stage-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .phone-frame {
      width: 480px;
      height: 310px;
      background-color: #000000;
      border: 4px solid #27272a;
      border-radius: 32px;
      box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.9), 0 0 45px rgba(56, 189, 248, 0.16);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (max-width: 540px) {
      .phone-frame {
        width: 100%;
        height: 240px;
      }
    }

    .gif-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* GIF Display Image */
    .taby-gif {
      width: auto;
      height: 100%;
      max-width: 100%;
      object-fit: contain;
      background-color: #000000;
      transition: transform 0.2s ease;
    }

    /* Rotation Classes */
    .rot-0 { transform: rotate(0deg); }
    .rot-90 { transform: rotate(90deg) scale(1.35); }
    .rot-180 { transform: rotate(180deg); }
    .rot-270 { transform: rotate(270deg) scale(1.35); }

    /* Top HUD / Status */
    .top-badge {
      position: absolute;
      top: 12px;
      left: 16px;
      background: rgba(24, 24, 27, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #38bdf8;
      font-size: 10px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: ui-monospace, monospace;
    }

    /* Bottom Progress Timer HUD */
    .hud-overlay {
      position: absolute;
      bottom: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      pointer-events: none;
      width: 90%;
    }
    .hud-main {
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
      font-family: ui-monospace, SFMono-Regular, monospace;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(14, 165, 233, 0.2);
      border: 1px solid rgba(56, 189, 248, 0.4);
      backdrop-filter: blur(8px);
      padding: 4px 12px;
      border-radius: 12px;
    }
    .playlist-progress-bar {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }
    .playlist-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      transition: width 0.1s linear;
    }

    /* Screen Toolbars */
    .screen-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 480px;
      gap: 8px;
      flex-wrap: wrap;
    }
    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #141418;
      border: 1px solid #27272a;
      padding: 4px 8px;
      border-radius: 12px;
    }
    .toolbar-label {
      font-size: 10px;
      font-weight: 700;
      color: #71717a;
      text-transform: uppercase;
      padding: 0 4px;
    }
    .toolbar-btn {
      background: #1c1c22;
      border: 1px solid #2d2d36;
      color: #d4d4d8;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .toolbar-btn:hover {
      background: #2a2a34;
      color: #fff;
    }
    .toolbar-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    /* Chip Explorer Card */
    .explorer-card {
      width: 100%;
      max-width: 1120px;
      background-color: #111115;
      border: 1px solid #24242c;
      border-radius: 20px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    /* Category Chips Filter Bar */
    .category-chips-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      width: 100%;
    }
    .cat-chip {
      background: #18181e;
      border: 1px solid #2a2a34;
      color: #a1a1aa;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
    }
    .cat-chip:hover {
      background: #22222a;
      color: #fff;
    }
    .cat-chip.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
    }

    .search-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .search-input {
      flex: 1;
      background: #16161c;
      border: 1px solid #2a2a34;
      color: #f4f4f5;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus {
      border-color: #38bdf8;
    }

    /* Complete Full Chip Grid */
    .chip-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 480px;
      overflow-y: auto;
      padding: 4px 2px;
    }
    .chip-cloud::-webkit-scrollbar {
      width: 6px;
    }
    .chip-cloud::-webkit-scrollbar-thumb {
      background: #2a2a34;
      border-radius: 6px;
    }

    .anim-chip {
      background: #18181f;
      border: 1px solid #2a2a36;
      color: #e4e4e7;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .anim-chip:hover {
      background: #262632;
      border-color: #404052;
      color: #ffffff;
      transform: translateY(-1px);
    }
    .anim-chip.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
      font-weight: 800;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.4);
    }
    .chip-badge {
      font-size: 9px;
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 6px;
      color: #a1a1aa;
      font-family: ui-monospace, monospace;
    }
    .anim-chip.active .chip-badge {
      background: rgba(0, 0, 0, 0.25);
      color: #ffffff;
    }
  </style>
</head>

    <div class="header">

      <p>All 84 official animations in Full Interactive Chips · Rotate & Continuous Auto-Playlist</p>
    </div>

    <!-- Phone Screen Simulator -->
    <div class="stage-wrapper">
      <div class="phone-frame" id="phoneScreen">
        <div class="top-badge" id="topBadge">

        </div>

        <div class="gif-container">
          <img id="tabyImage" class="taby-gif rot-90" src="./taby_assets/342748ab.gif" alt="Taby Face" />
        </div>

        <div class="hud-overlay" id="hudOverlay">
          <div class="hud-main" id="hudMain">
            <span id="hudIcon">👀</span> <span id="hudText">ANGRY_01_LOOP</span>
          </div>
          <div class="playlist-progress-bar">
            <div class="playlist-progress-fill" id="progressFill"></div>
          </div>
        </div>
      </div>

      <!-- Controls below screen -->
      <div class="screen-toolbar">
        <div class="toolbar-group">
          <span class="toolbar-label">🔄 Rotate:</span>
          <button class="toolbar-btn" onclick="setRotation(0)">0°</button>
          <button class="toolbar-btn active" id="btnRot90" onclick="setRotation(90)">90° (Upright)</button>
          <button class="toolbar-btn" onclick="setRotation(180)">180°</button>
          <button class="toolbar-btn" id="btnRot270" onclick="setRotation(270)">270°</button>
        </div>

        <div class="toolbar-group">
          <button class="toolbar-btn active" id="btnAutoPlay" onclick="toggleAutoPlay()" style="display: flex; align-items: center; gap: 5px; color: #38bdf8;">
            <span id="playIcon">⏸️</span> Auto Playlist (<span id="speedSec">3.5s</span>)
          </button>
          <button class="toolbar-btn" onclick="prevAnimation()">⏮️ Prev</button>
          <button class="toolbar-btn" onclick="nextAnimation()">⏭️ Next</button>
          <button class="toolbar-btn" onclick="playRandom()">🔀 Random</button>
        </div>
      </div>
    </div>

    <!-- Full Chip Explorer Section -->
    <div class="explorer-card">
      <!-- Category Filter Chips -->
      <div class="category-chips-bar">
        <button class="cat-chip active" onclick="filterCategory('ALL')">🌟 All (84)</button>
        <button class="cat-chip" onclick="filterCategory('IDLE')">👀 Idle & Moods (18)</button>
        <button class="cat-chip" onclick="filterCategory('WORK')">💻 Work & Code (14)</button>
        <button class="cat-chip" onclick="filterCategory('SUCCESS')">🎉 Success & Joy (15)</button>
        <button class="cat-chip" onclick="filterCategory('DAILY')">🧘 Daily & Relax (16)</button>
        <button class="cat-chip" onclick="filterCategory('SPORTS')">🏀 Sports & Action (10)</button>
        <button class="cat-chip" onclick="filterCategory('CALM')">😌 Calm Series (11)</button>
      </div>

      <div class="search-row">
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="🔍 Filter chips (e.g. love, dunk, work, sleep, f1, claude, boxing...)" 
          oninput="onSearch(this.value)"
        />
        <span id="countBadge" style="font-size: 11px; font-weight: 700; color: #38bdf8; background: #16161c; border: 1px solid #2a2a34; padding: 7px 12px; border-radius: 10px; white-space: nowrap;">
          Showing: 84 / 84
        </span>
      </div>

      <!-- All 84 Chips Cloud -->
      <div class="chip-cloud" id="chipCloud">
        <!-- Injected via JavaScript -->
      </div>
    </div>
  </div>

    const tabyImg = document.getElementById("tabyImage");
    const hudMain = document.getElementById("hudMain");
    const hudIcon = document.getElementById("hudIcon");
    const hudText = document.getElementById("hudText");
    const chipCloud = document.getElementById("chipCloud");
    const searchInput = document.getElementById("searchInput");
    const countBadge = document.getElementById("countBadge");
    const btnAutoPlay = document.getElementById("btnAutoPlay");
    const playIcon = document.getElementById("playIcon");
    const progressFill = document.getElementById("progressFill");
    const badgeIndex = document.getElementById("badgeIndex");

    let currentCategory = "ALL";
    let searchQuery = "";
    let currentIndex = 0;
    let isAutoPlay = true;
    let autoPlayInterval = null;
    let progressInterval = null;
    let slideDuration = 3500;
    let progressStartTime = Date.now();

    function renderChips() {
      chipCloud.innerHTML = "";
      const filtered = ALL_ITEMS.filter(item => {
        const matchCat = (currentCategory === "ALL" || item.category === currentCategory);
        const matchSearch = (!searchQuery || item.id.toLowerCase().includes(searchQuery.toLowerCase()) || item.label.toLowerCase().includes(searchQuery.toLowerCase()));
        return matchCat && matchSearch;
      });

      countBadge.textContent = "Showing: " + filtered.length + " / " + ALL_ITEMS.length;

      filtered.forEach(item => {
        const chip = document.createElement("button");
        const isActive = tabyImg.src.includes(item.file);
        chip.className = "anim-chip" + (isActive ? " active" : "");
        chip.id = "chip-" + item.id;
        chip.onclick = () => {
          currentIndex = ALL_ITEMS.findIndex(a => a.id === item.id);
          playAnimation(item);
          resetProgress();
        };

        const icon = item.category === "WORK" ? "💻" : item.category === "SUCCESS" ? "🎉" : item.category === "DAILY" ? "🧘" : item.category === "SPORTS" ? "🏀" : "✨";
        chip.innerHTML = icon + " " + item.id + ' <span class="chip-badge">' + item.label + '</span>';
        chipCloud.appendChild(chip);
      });
    }

    function playAnimation(item) {
      if (!item) return;
      tabyImg.src = "./taby_assets/" + item.file;

      const idx = ALL_ITEMS.findIndex(a => a.id === item.id);
      badgeIndex.textContent = (idx + 1) + " / " + ALL_ITEMS.length;

      const icon = item.category === "WORK" ? "⚡" : item.category === "SUCCESS" ? "🎉" : item.category === "DAILY" ? "🧘" : item.category === "SPORTS" ? "🏆" : "👀";
      hudIcon.textContent = icon;
      hudText.textContent = item.id.toUpperCase() + " · " + item.label;

      document.querySelectorAll(".anim-chip").forEach(c => c.classList.remove("active"));
      const currentChip = document.getElementById("chip-" + item.id);
      if (currentChip) {
        currentChip.classList.add("active");
        currentChip.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }
    }

    function setRotation(deg) {
      tabyImg.className = "taby-gif rot-" + deg;
      document.querySelectorAll(".screen-toolbar .toolbar-btn").forEach(btn => {
        if (btn.textContent.includes("°")) {
          btn.classList.toggle("active", btn.textContent.startsWith(deg + "°"));
        }
      });
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll(".cat-chip").forEach(chip => {
        chip.classList.toggle("active", chip.getAttribute("onclick").includes("'" + cat + "'"));
      });
      renderChips();
    }

    function onSearch(val) {
      searchQuery = val.trim();
      renderChips();
    }

    function nextAnimation() {
      currentIndex = (currentIndex + 1) % ALL_ITEMS.length;
      playAnimation(ALL_ITEMS[currentIndex]);
      resetProgress();
    }

    function prevAnimation() {
      currentIndex = (currentIndex - 1 + ALL_ITEMS.length) % ALL_ITEMS.length;
      playAnimation(ALL_ITEMS[currentIndex]);
      resetProgress();
    }

    function playRandom() {
      currentIndex = Math.floor(Math.random() * ALL_ITEMS.length);
      playAnimation(ALL_ITEMS[currentIndex]);
      resetProgress();
    }

    function resetProgress() {
      progressStartTime = Date.now();
      progressFill.style.width = "0%";
    }

    function toggleAutoPlay() {
      isAutoPlay = !isAutoPlay;
      if (isAutoPlay) {
        btnAutoPlay.classList.add("active");
        playIcon.textContent = "⏸️";
        resetProgress();
        startAutoPlayLoop();
      } else {
        btnAutoPlay.classList.remove("active");
        playIcon.textContent = "▶️";
        clearInterval(autoPlayInterval);
        clearInterval(progressInterval);
        progressFill.style.width = "0%";
      }
    }

    function startAutoPlayLoop() {
      clearInterval(autoPlayInterval);
      clearInterval(progressInterval);

      progressStartTime = Date.now();
      progressInterval = setInterval(() => {
        if (!isAutoPlay) return;
        const elapsed = Date.now() - progressStartTime;
        const pct = Math.min(100, (elapsed / slideDuration) * 100);
        progressFill.style.width = pct + "%";
        if (elapsed >= slideDuration) {
          nextAnimation();
        }
      }, 50);
    }

    // Init
    renderChips();
    playAnimation(ALL_ITEMS[0]);
    startAutoPlayLoop();
  </script>
